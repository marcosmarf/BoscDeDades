<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BoscDeDades - WebEditor</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    .preview-label {
      font-family: monospace;
      font-size: 0.75em;
      color: #555;
      background: #0d0d0d;
      border: 1px dashed #333;
      border-radius: 6px;
      padding: 4px 12px;
      margin: 40px 0 8px;
      display: inline-block;
    }
  </style>
</head>
<body>

<template id="WEB_PAGE_HEADER">
<!DOCTYPE html>
<html lang='INTL_LANG'>
<head>
  <meta charset='utf-8'/>
  <meta name='viewport' content='width=device-width,initial-scale=1'/>
  <link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap' rel='stylesheet'>
  <title>{t}</title>
</template>

<template id="WEB_PAGE_FOOTER">
<br/><br/>
<a class='b' href='/' style='display:block;width:auto;margin:0 auto 0 0;'>INTL_BACK_TO_HOME</a>
<br/><br/>
</div>
<footer class='footer'>
  <div style='padding:16px'>
    <a href='https://boscdedades.cat' target='_blank' rel='noreferrer'>Bosc de Dades</a>
    &nbsp;&mdash;&nbsp;
    <a href='mailto:boscdedades@tecnocampus.cat'>INTL_REPORT_ISSUE</a>
  </div>
</footer>
</body>
</html>
</template>

<template id="WEB_ROOT_PAGE_CONTENT">
<a class='b' href='/values'>{t}</a><br/>
<a class='b' href='/status'>{s}</a><br/>
<a class='b' href='https://maps.sensor.community/' target='_blank' rel='noreferrer'>INTL_ACTIVE_SENSORS_MAP</a><br/>
<a class='b' href='/config'>{conf}</a><br/>
<a class='b' href='/removeConfig'>INTL_CONFIGURATION_DELETE</a><br/>
<a class='b' href='/reset'>{restart}</a><br/>
<a class='b' href='/debug'>{debug}</a><br/>
</template>

<template id="WEB_REMOVE_CONFIG_CONTENT">
<h3>INTL_CONFIGURATION_REALLY_DELETE</h3>
<table>
  <tr>
    <td>
      <form method='POST' action='/removeConfig'>
        <input type='submit' class='s_red' name='submit' value='INTL_DELETE'/>
      </form>
    </td>
    <td>
      <a class='b' href='/'>INTL_CANCEL</a>
    </td>
  </tr>
</table>
</template>

<template id="WEB_RESET_CONTENT">
<h3>INTL_REALLY_RESTART_SENSOR</h3>
<table>
  <tr>
    <td>
      <form method='POST' action='/reset'>
        <input type='submit' class='s_red' name='submit' value='INTL_RESTART'/>
      </form>
    </td>
    <td>
      <a class='b' href='/'>INTL_CANCEL</a>
    </td>
  </tr>
</table>
</template>


<!-- Just for preview -->
<div class="content">
  <span class="preview-label">Vista previa: pagina principal</span>
  <h2>Sensor {id}</h2>
  <a class="b" href="#">Valors actuals</a>
  <a class="b" href="#">Estat del dispositiu</a>
  <a class="b" href="#">Mapa de sensors actius</a>
  <a class="b" href="#">Configuracio</a>
  <a class="b" href="#">Esborrar configuracio</a>
  <a class="b" href="#">Reinicia el sensor</a>
  <a class="b" href="#">Nivell de depuracio</a>

  <br/><br/>
  <a class="b" href="#" style="display:block;width:auto;margin:0 auto 0 0;">Torna a la pagina d'inici</a>
</div>

<footer class="footer">
  <div style="padding:16px">
    <a href="https://boscdedades.cat" target="_blank" rel="noreferrer">Bosc de Dades</a>
    &nbsp;&mdash;&nbsp;
    <a href="mailto:boscdedades@tecnocampus.cat">Informa d'un problema</a>
  </div>
</footer>

</body>
</html>
